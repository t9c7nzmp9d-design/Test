<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Würfel</title>

  <!-- iPad / iOS App-Einstellungen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Würfel">
  <meta name="theme-color" content="#c0392b">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    :root {
      --bg: #f4f1ea;
      --text: #222;
      --die: #ffffff;
      --die-border: #333;
      --pip: #222;
      --accent: #c0392b;
      --die-size: min(55vw, 45vh, 420px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e24;
        --text: #eee;
        --die: #2d2d36;
        --die-border: #ccc;
        --pip: #eee;
        --accent: #e05a4a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vh;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
    }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
    .controls {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: clamp(1.2rem, 2.5vw, 1.6rem); }
    select, button {
      font: inherit;
      font-size: clamp(1.3rem, 2.8vw, 1.8rem);
      min-height: 64px;
      padding: 12px 28px;
      border-radius: 16px;
      border: 3px solid var(--die-border);
      background: var(--die);
      color: var(--text);
      cursor: pointer;
    }
    select {
      -webkit-appearance: none;
      appearance: none;
      padding-right: 52px;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 28px) 50%, calc(100% - 18px) 50%;
      background-size: 10px 10px;
      background-repeat: no-repeat;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
      min-width: 220px;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.6; }

    .die {
      width: var(--die-size);
      height: var(--die-size);
      background: var(--die);
      border: calc(var(--die-size) * 0.025) solid var(--die-border);
      border-radius: calc(var(--die-size) * 0.15);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      cursor: pointer;
    }
    .die.rolling { animation: roll 0.6s ease-in-out; }
    @keyframes roll {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(90deg) scale(0.9); }
      50%  { transform: rotate(180deg) scale(1.05); }
      75%  { transform: rotate(270deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .pips {
      position: absolute;
      inset: 7%;
    }
    .pip {
      position: absolute;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--pip);
      transform: translate(-50%, -50%);
    }
    .number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--die-size) * 0.4);
      font-weight: 700;
    }
    .result { font-size: clamp(1.3rem, 3vw, 2rem); min-height: 1.5em; }
    .hint { font-size: 1rem; opacity: 0.6; margin-top: -3vh; }
  </style>
</head>
<body>
  <h1>🎲 Würfel</h1>

  <div class="controls">
    <label for="sides">Seiten:</label>
    <select id="sides">
      <option value="4">4</option>
      <option value="6" selected>6</option>
      <option value="8">8</option>
      <option value="10">10</option>
      <option value="12">12</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="100">100</option>
    </select>
    <button id="rollBtn">Würfeln</button>
  </div>

  <div id="die" class="die" role="button" aria-label="Würfeln" aria-live="polite"></div>
  <div id="result" class="result"></div>
  <div class="hint">Tipp: Auch ein Tippen auf den Würfel würfelt.</div>

  <script>
    // Klassische Augen 1–9 im 3x3-Raster als [Spalte, Zeile] (0–2)
    const CLASSIC_LAYOUTS = {
      1: [[1, 1]],
      2: [[0, 0], [2, 2]],
      3: [[0, 0], [1, 1], [2, 2]],
      4: [[0, 0], [2, 0], [0, 2], [2, 2]],
      5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
      6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]],
      7: [[0, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [2, 2]],
      8: [[0, 0], [1, 0], [2, 0], [0, 1], [2, 1], [0, 2], [1, 2], [2, 2]],
      9: [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]]
    };

    // Ab 10: Anzahl der Augen pro Zeile (symmetrisch, jede Zeile zentriert)
    const ROW_LAYOUTS = {
      10: [3, 4, 3],
      11: [4, 3, 4],
      12: [4, 4, 4],
      13: [3, 2, 3, 2, 3],
      14: [4, 3, 3, 4],
      15: [2, 4, 3, 4, 2],
      16: [4, 4, 4, 4],
      17: [4, 3, 3, 3, 4],
      18: [3, 4, 4, 4, 3],
      19: [3, 4, 5, 4, 3],
      20: [4, 4, 4, 4, 4],
      21: [4, 4, 5, 4, 4],
      22: [4, 5, 4, 5, 4],
      23: [5, 4, 5, 4, 5],
      24: [5, 5, 4, 5, 5]
    };
    const MAX_PIPS = 24;

    // Liefert die Augenpositionen und die Rastergröße für einen Wert
    function pipLayout(value) {
      if (CLASSIC_LAYOUTS[value]) {
        return { size: 3, points: CLASSIC_LAYOUTS[value] };
      }
      const rows = ROW_LAYOUTS[value];
      const size = Math.max(rows.length, ...rows);
      const points = [];
      rows.forEach((count, r) => {
        const y = r + (size - rows.length) / 2;
        for (let i = 0; i < count; i++) {
          points.push([i + (size - count) / 2, y]);
        }
      });
      return { size, points };
    }

    const dieEl = document.getElementById("die");
    const sidesEl = document.getElementById("sides");
    const rollBtn = document.getElementById("rollBtn");
    const resultEl = document.getElementById("result");
    let rolling = false;

    function showValue(value) {
      dieEl.innerHTML = "";
      if (value <= MAX_PIPS) {
        // Augen darstellen
        const { size, points } = pipLayout(value);
        const cell = 100 / size;
        const container = document.createElement("div");
        container.className = "pips";
        for (const [x, y] of points) {
          const pip = document.createElement("div");
          pip.className = "pip";
          pip.style.left = `${(x + 0.5) * cell}%`;
          pip.style.top = `${(y + 0.5) * cell}%`;
          pip.style.width = `${cell * 0.62}%`;
          container.appendChild(pip);
        }
        dieEl.appendChild(container);
      } else {
        // Größere Werte als Zahl darstellen
        const num = document.createElement("div");
        num.className = "number";
        num.textContent = value;
        dieEl.appendChild(num);
      }
    }

    function randomRoll(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function roll() {
      if (rolling) return;
      rolling = true;
      const sides = parseInt(sidesEl.value, 10);
      rollBtn.disabled = true;
      resultEl.textContent = "";

      // Während der Animation zufällige Werte durchlaufen lassen
      const flicker = setInterval(() => showValue(randomRoll(sides)), 80);
      dieEl.classList.remove("rolling");
      void dieEl.offsetWidth; // Animation neu starten
      dieEl.classList.add("rolling");

      setTimeout(() => {
        clearInterval(flicker);
        const value = randomRoll(sides);
        showValue(value);
        resultEl.textContent = `Ergebnis: ${value} (W${sides})`;
        rollBtn.disabled = false;
        rolling = false;
      }, 600);
    }

    rollBtn.addEventListener("click", roll);
    dieEl.addEventListener("click", roll);
    sidesEl.addEventListener("change", () => {
      showValue(1);
      resultEl.textContent = "";
    });

    showValue(1);

    // Offline-Unterstützung
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
