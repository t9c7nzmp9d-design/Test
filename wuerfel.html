<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Würfel</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --text: #222;
      --die: #ffffff;
      --die-border: #333;
      --pip: #222;
      --accent: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e24;
        --text: #eee;
        --die: #2d2d36;
        --die-border: #ccc;
        --pip: #eee;
        --accent: #e05a4a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 1rem; }
    select, button {
      font-size: 1.1rem;
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid var(--die-border);
      background: var(--die);
      color: var(--text);
      cursor: pointer;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .die {
      width: 160px;
      height: 160px;
      background: var(--die);
      border: 4px solid var(--die-border);
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 18px;
      position: relative;
    }
    .die.rolling { animation: roll 0.6s ease-in-out; }
    @keyframes roll {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(90deg) scale(0.9); }
      50%  { transform: rotate(180deg) scale(1.05); }
      75%  { transform: rotate(270deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .pip {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--pip);
      align-self: center;
      justify-self: center;
    }
    .number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: 700;
    }
    .result { font-size: 1.2rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>🎲 Würfel</h1>

  <div class="controls">
    <label for="sides">Seiten:</label>
    <select id="sides">
      <option value="4">4</option>
      <option value="6" selected>6</option>
      <option value="8">8</option>
      <option value="10">10</option>
      <option value="12">12</option>
      <option value="20">20</option>
      <option value="100">100</option>
    </select>
    <button id="rollBtn">Würfeln</button>
  </div>

  <div id="die" class="die" aria-live="polite"></div>
  <div id="result" class="result"></div>

  <script>
    // Positionen der Augen im 3x3-Raster (Zeile, Spalte) für die Werte 1–6
    const PIP_LAYOUTS = {
      1: [[2, 2]],
      2: [[1, 1], [3, 3]],
      3: [[1, 1], [2, 2], [3, 3]],
      4: [[1, 1], [1, 3], [3, 1], [3, 3]],
      5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]],
      6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
    };

    const dieEl = document.getElementById("die");
    const sidesEl = document.getElementById("sides");
    const rollBtn = document.getElementById("rollBtn");
    const resultEl = document.getElementById("result");

    function showValue(value) {
      dieEl.innerHTML = "";
      if (value <= 6) {
        // Klassische Augen darstellen
        for (const [row, col] of PIP_LAYOUTS[value]) {
          const pip = document.createElement("div");
          pip.className = "pip";
          pip.style.gridRow = row;
          pip.style.gridColumn = col;
          dieEl.appendChild(pip);
        }
      } else {
        // Größere Werte als Zahl darstellen
        const num = document.createElement("div");
        num.className = "number";
        num.textContent = value;
        dieEl.appendChild(num);
      }
    }

    function randomRoll(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function roll() {
      const sides = parseInt(sidesEl.value, 10);
      rollBtn.disabled = true;
      resultEl.textContent = "";

      // Während der Animation zufällige Werte durchlaufen lassen
      const flicker = setInterval(() => showValue(randomRoll(sides)), 80);
      dieEl.classList.remove("rolling");
      void dieEl.offsetWidth; // Animation neu starten
      dieEl.classList.add("rolling");

      setTimeout(() => {
        clearInterval(flicker);
        const value = randomRoll(sides);
        showValue(value);
        resultEl.textContent = `Ergebnis: ${value} (W${sides})`;
        rollBtn.disabled = false;
      }, 600);
    }

    rollBtn.addEventListener("click", roll);
    sidesEl.addEventListener("change", () => {
      showValue(1);
      resultEl.textContent = "";
    });

    showValue(1);
  </script>
</body>
</html>
